apiVersion: v1               # API版本，Pod固定为v1
kind: Pod                    # 资源类型；生产建议用Deployment/StatefulSet/DaemonSet
metadata:                    # 元数据
  name: my-pod               # 必填，Pod名称；符合RFC 1035：小写字母/数字/‘-’，以字母数字开头结尾
  namespace: default         # 可选，命名空间，默认default
  labels:                    # 键值对map，不是列表！用于Service/Deployment选择器匹配
    app: my-app
    tier: backend
  annotations:               # 键值对map，不是列表！用于非标识性元数据，如说明、监控采集
    description: "示例 Pod"
    owner: "team-a"

spec:
  containers:                # 必填，容器列表
  - name: my-container       # 必填，容器名，符合RFC 1035
    image: nginx:1.25        # 必填，镜像名:标签；不写标签默认latest
    imagePullPolicy: IfNotPresent      # 镜像拉取策略，可选值：Always，Never，IfNotPresent
                                       # （1）Always：表示每次都尝试重新拉取镜像
                                       # （2）IfNotPresent：表示如果本地有该镜像，则使用本地的镜像，本地不存在时拉取镜像。
                                       # （3）Never：表示仅使用本地镜像。
                                       # 默认：如果tag是latest或不写tag，默认Always；否则默认IfNotPresent
                                       # 若启用AlwaysPullImages准入控制器，会强制Always
                                       # command/args 会覆盖 Dockerfile 的 ENTRYPOINT/CMD
    # 如果启用下面两行，nginx 不会启动，80 端口探针会失败
    # command: ["/bin/sh"]     # 可选，覆盖Dockerfile ENTRYPOINT；注意是exec数组，不是shell字符串
    # args: ["-c", "echo hello && sleep 3600"]           # 可选，覆盖Dockerfile CMD
    workingDir: /app         # 可选，容器工作目录；注意目录最好存在且可写

    ports:                   # 可选，容器端口列表
    - name: http             # 端口名：Service可通过名字引用
      containerPort: 80      # 容器监听端口
      hostPort: 8080         # 可选，宿主机端口；不推荐！会限制调度，同一节点同一端口不能冲突
      protocol: TCP          # 可选：TCP/UDP/SCTP，默认TCP

    env:                     # 可选，环境变量列表
    - name: APP_ENV          # 环境变量的名称
      value: "prod"          # 环境变量的值
    - name: DB_PASSWORD
      valueFrom:             # 从Secret/ConfigMap/字段引用
        secretKeyRef:
          name: db-secret
          key: password

    resources:               # 强烈建议设置；影响调度、QoS、驱逐优先级
      requests:              # 调度时预留资源
        cpu: "250m"          # 1 core = 1000 m；250 m = 0.25 核
        memory: "256Mi"      # 内存单位：MiB，GiB
      limits:                # 运行时上限；CPU超限被限流，内存超限可能OOMKilled
        cpu: "500m"          # CPU限制，单位为core数，将用于docker run --cpu-shares参数
        memory: "512Mi"      # 内存限制，单位可以为MiB，GiB等，将用于docker run --memory参数

    volumeMounts:            # 可选，挂载卷到容器内部
    - name: config-volume
      mountPath: /etc/config # 容器内绝对路径，应少于512字符
      readOnly: true         # 默认false
    - name: temp-volume
      mountPath: /tmp

    livenessProbe:           # 存活探针；失败达到阈值后kubelet重启容器
      httpGet:               # 方式：exec/httpGet/tcpSocket，只能选一种
        path: /healthz       # 注意：nginx默认没有/healthz，需要应用提供或改用tcpSocket
        port: 80
        scheme: HTTP         # 默认HTTP
      initialDelaySeconds: 15 # 容器启动后首次探测延迟，单位为s，默认0
      periodSeconds: 20      # 探测周期，默认10
      timeoutSeconds: 1      # 超时时间，默认1
      successThreshold: 1    # liveness必须为1
      failureThreshold: 3    # 连续失败几次之后重启，默认3

    readinessProbe:          # 就绪探针；失败会从Service Endpoint移除，不重启容器
      tcpSocket:
        port: 80
      initialDelaySeconds: 5
      periodSeconds: 10

    startupProbe:            # 启动探针；慢启动应用推荐，成功后liveness/readiness才生效
      httpGet:
        path: /healthz
        port: 80
      failureThreshold: 30
      periodSeconds: 10

    securityContext:         # 容器级安全上下文
      privileged: false      # 是否特权容器，默认false；生产禁止true
      allowPrivilegeEscalation: false       # 禁止提权
      readOnlyRootFilesystem: true          # 根文件系统只读；需配合emptyDir挂载可写目录；注意：nginx需要写/var/cache/nginx、/var/run等
      runAsNonRoot: true     # 禁止以root运行；注意：官方nginx:1.25可能冲突
      runAsUser: 1000        # 以UID 1000运行
      runAsGroup: 1000
      capabilities:
        drop: ["ALL"]        # 移除所有Linux capabilities
        # add: ["NET_BIND_SERVICE"]        # 如需绑定80以下端口可加
  
  restartPolicy: Alway       # Pod的重启策略，可选：Always/OnFailure/Never，默认Always。
                             # （1）Always：Pod一旦终止运行，则无论容器是如何终止的，kubelet都将重启它
                             # （2）OnFailure：非零退出码才重启
                             # （3）Never：不重启
  serviceAccountName: default # 可选，Pod使用的ServiceAccount;旧字段serviceAccount已废弃
  automountServiceAccountToken: false        # 可选，是否自动挂载SA token，默认true；安全可设false

  nodeSelector:              # 可选，简单调度：选择有这些标签的节点
    disktype: ssd

  imagePullSecrets:          # 可选，拉取镜像私有的Secret列表
  - name: my-registry-secret

  hostNetwork: false         # 可选，是否使用宿主机网络，默认false
  dnsPolicy: ClusterFirst    # 可选：ClusterFirst/Default/ClusterFirstWithHostNet/None
                             # hostNetwork=true时常用ClusterFirstWithHostNet
  terminationGracePeriodSeconds: 30     # 可选，优雅终止等待秒数，默认30

  securityContext:           # Pod级安全上下文
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 2000            # 卷的组所有权
    seccompProfile:
      type: RuntimeDefault   # 推荐，限制系统调用

  volumes:                   # 可选，共享存储卷列表
  - name: config-volume
    configMap:
      name: my-config
      items:
      - key: app.properties
        path: app.properties

  - name: secret-volume
    secret:
      secretName: my-secret
      items:
      - key: tls.crt
        path: tls.crt

  - name: temp-volume
    emptyDir: {}            # Pod生命周期临时目录

  - name: host-data
    hostPath:                # 挂载宿主机的目录；
      path: /data            # Pod所在主机的目录，将被用于容器中mount的目录
      type: DirectoryOrCreate # 可选：DirectoryOrCreate/Directory/FileOrCreate/File/Socket等

  - name: pvc-volume
    persistentVolumeClaim:
      claimName: my-pvc
