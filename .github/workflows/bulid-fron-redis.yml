name: Build and Push frontend-redis

on:
  push:
    branches: [ "main" ]
    paths:
      - 'frontend-redis/**'  # 只有frontend-redis变动才会触发
  workflow_dispatch: # 允许手动点击按钮触发

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-redis   # 指向frontend-redis
          file: ./frontend-redis/Dockerfile   # 指向frontend-redis的Docker文件路径
          push: true
          tags: ghcr.io/tang-yin/frontend-redis-custom:v1
